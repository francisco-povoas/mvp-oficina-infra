[tool.pytest.ini_options]
testpaths = ["tests/bdd"]
pythonpath = ["."]
addopts = "-ra --strict-markers -p no:cacheprovider"
markers = [
  "stage1: validações estruturais executáveis na Etapa 1",
  "stage3: cenários distribuídos que somente serão ativados na Etapa 3",
]

[tool.ruff]
target-version = "py312"
line-length = 88
