apiVersion: v1
kind: Service
metadata:
  name: financeiro-dynamodb
  namespace: mvp-oficina
spec:
  type: ClusterIP
  selector:
    app: financeiro-dynamodb
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: financeiro-dynamodb
  namespace: mvp-oficina
  labels:
    app: financeiro-dynamodb
    app.kubernetes.io/component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: financeiro-dynamodb
  template:
    metadata:
      labels:
        app: financeiro-dynamodb
    spec:
      containers:
        - name: dynamodb-local
          image: amazon/dynamodb-local:2.6.1
          args: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            tcpSocket: {port: http}
            initialDelaySeconds: 3
            periodSeconds: 3
          livenessProbe:
            tcpSocket: {port: http}
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 192Mi}
            limits: {cpu: 400m, memory: 384Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: elasticmq
  namespace: mvp-oficina
spec:
  type: ClusterIP
  selector:
    app: elasticmq
  ports:
    - name: sqs
      port: 9324
      targetPort: sqs
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticmq
  namespace: mvp-oficina
  labels:
    app: elasticmq
    app.kubernetes.io/component: messaging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: elasticmq
  template:
    metadata:
      labels:
        app: elasticmq
    spec:
      containers:
        - name: elasticmq
          image: softwaremill/elasticmq-native:1.7.1
          ports:
            - name: sqs
              containerPort: 9324
          volumeMounts:
            - name: config
              mountPath: /opt/elasticmq.conf
              subPath: elasticmq.conf
              readOnly: true
          readinessProbe:
            httpGet: {path: /health, port: sqs}
            initialDelaySeconds: 3
            periodSeconds: 3
          livenessProbe:
            httpGet: {path: /health, port: sqs}
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: {cpu: 25m, memory: 96Mi}
            limits: {cpu: 300m, memory: 256Mi}
      volumes:
        - name: config
          configMap:
            name: elasticmq-config
