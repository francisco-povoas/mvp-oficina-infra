apiVersion: v1
kind: Service
metadata:
  name: ordens-db
  namespace: mvp-oficina
spec:
  type: ClusterIP
  selector:
    app: ordens-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ordens-db
  namespace: mvp-oficina
  labels:
    app: ordens-db
    app.kubernetes.io/component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ordens-db
  template:
    metadata:
      labels:
        app: ordens-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: ordens
            - name: POSTGRES_USER
              value: ordens
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: checkpoint-a-secrets
                  key: ordens-postgres-password
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "ordens", "-d", "ordens"]
            initialDelaySeconds: 3
            periodSeconds: 3
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "ordens", "-d", "ordens"]
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 300m, memory: 256Mi}
      volumes:
        - name: data
          emptyDir: {}
---
