apiVersion: v1
kind: Service
metadata:
  name: ordens-api
  namespace: mvp-oficina
spec:
  type: ClusterIP
  selector: {app: ordens-api}
  ports:
    - name: http
      port: 8001
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ordens-api
  namespace: mvp-oficina
  labels: {app: ordens-api, app.kubernetes.io/component: api}
spec:
  replicas: 1
  selector:
    matchLabels: {app: ordens-api}
  template:
    metadata:
      labels: {app: ordens-api}
    spec:
      containers:
        - name: api
          image: mvp-oficina-ordens:checkpoint-a
          imagePullPolicy: Never
          command: ["uvicorn", "app.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8001"]
          ports:
            - {name: http, containerPort: 8001}
          envFrom:
            - configMapRef: {name: checkpoint-a-config}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: checkpoint-a-secrets, key: ordens-database-url}
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef: {name: checkpoint-a-secrets, key: jwt-secret-key}
            - name: SERVICE_CLIENTS_JSON
              valueFrom:
                secretKeyRef: {name: checkpoint-a-secrets, key: service-clients-json}
            - name: SERVICE_CLIENT_SECRET
              valueFrom:
                secretKeyRef: {name: checkpoint-a-secrets, key: service-client-secret}
            - {name: SERVICE_CLIENT_ID, value: mvp-oficina-ordens}
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 3
            periodSeconds: 3
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 384Mi}
---
