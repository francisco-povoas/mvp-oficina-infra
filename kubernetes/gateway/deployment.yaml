apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong
  labels:
    app.kubernetes.io/name: kong
    app.kubernetes.io/part-of: mvp-oficina
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kong
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kong
        app.kubernetes.io/part-of: mvp-oficina
    spec:
      containers:
        - name: kong
          image: kong:3.9.3
          imagePullPolicy: IfNotPresent
          env:
            - name: KONG_DATABASE
              value: "off"
            - name: KONG_DECLARATIVE_CONFIG
              value: /kong/declarative/kong.yaml
            - name: KONG_PROXY_LISTEN
              value: 0.0.0.0:8000
            - name: KONG_ADMIN_LISTEN
              value: 127.0.0.1:8001
            - name: KONG_STATUS_LISTEN
              value: 0.0.0.0:8100
            - name: KONG_NGINX_WORKER_PROCESSES
              value: "1"
            - name: KONG_NGINX_WORKER_CONNECTIONS
              value: "1024"
            - name: KONG_MEM_CACHE_SIZE
              value: 32m
          ports:
            - name: proxy
              containerPort: 8000
            - name: status
              containerPort: 8100
          readinessProbe:
            httpGet:
              path: /status
              port: status
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /status
              port: status
            periodSeconds: 10
            timeoutSeconds: 3
          startupProbe:
            httpGet:
              path: /status
              port: status
            failureThreshold: 30
            periodSeconds: 3
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: configuration
              mountPath: /kong/declarative/kong.yaml
              subPath: kong.yaml
              readOnly: true
      volumes:
        - name: configuration
          configMap:
            name: kong-config
